name: Build and Deploy to Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/expenses-backend:latest
            ghcr.io/${{ env.REPO_OWNER }}/expenses-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/expenses-frontend:latest
            ghcr.io/${{ env.REPO_OWNER }}/expenses-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment on Droplet..."
            cd ${{ secrets.APP_DIR }}

            echo "📥 Fetching latest configuration files..."
            git pull origin main || (git fetch origin main && git reset --hard origin/main)

            echo "🔑 Authenticating Docker with GHCR (if credentials provided)..."
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi

            # Check for docker compose plugin or standalone docker-compose
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo "📦 Pulling pre-built images from GHCR..."
            $COMPOSE_CMD -f docker-compose.prod.yml pull

            echo "🔄 Starting updated containers..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --remove-orphans

            echo "🗄️ Running database migrations..."
            $COMPOSE_CMD -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "🧹 Cleaning up old/dangling images..."
            docker image prune -f

            echo "✅ Deployment finished successfully!"
